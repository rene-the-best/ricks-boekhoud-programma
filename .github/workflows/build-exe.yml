name: Bouw Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "vibe/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Installeer afhankelijkheden
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Bouw exe
        run: |
          nicegui-pack --onefile --name "RicksBoekhoudProgramma" app\main.py
      - name: Upload exe als artefact
        uses: actions/upload-artifact@v4
        with:
          name: Rick-s-Boekhoud-Programma-exe
          path: dist/RicksBoekhoudProgramma.exe
